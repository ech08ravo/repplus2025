run_as shiny;

server {
  listen 3838;

  location / {
    site_dir /srv/shiny-server;

    # Kill idle sessions after 15 minutes to free memory
    app_idle_timeout 900;

    # Allow up to 60 seconds for app to start
    app_init_timeout 60;

    # Log all Shiny output
    log_dir /var/log/shiny-server;

    # Sanitize error messages shown to users
    sanitize_errors true;

    directory_index on;
  }
}
